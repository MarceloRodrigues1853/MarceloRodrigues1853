name: Atualizar README automático

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 Brasília; a fila do GitHub pode atrasar o início.
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/TEMPLATE.md"
      - "data/profile.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: read

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar geração e falhas de API
        run: python -m unittest discover -s tests -v
      - name: Validar template com dados já coletados
        run: python scripts/update_readme.py --offline

  update-readme:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout da branch de publicação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar README, estatísticas e dados para o portfólio
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py
      - name: Verificar arquivos gerados
        run: git diff --check
      - name: Publicar atualização automática
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md data/github.json assets/github-stats.svg assets/languages.svg 'assets/projects/*.svg'
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos arquivos gerados."
            exit 0
          fi
          git commit -m "Atualiza dados públicos do perfil [skip ci]"
          git push origin "HEAD:$TARGET_BRANCH"
